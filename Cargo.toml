[package]
name = "d-mcp"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
description = "Manage MCP server definitions once and sync them into every coding-agent harness."
license = "MIT"
repository = "https://github.com/fastner/d-mcp"
readme = false
publish = false
exclude = [".github/", "docs/"]

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tempfile = "3"
thiserror = "2"
toml_edit = "0.25"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
proptest = "1"

# The fake `claude` of the integration tests (tests/common/mod.rs installs
# it into a temporary PATH). A test target without the libtest harness, so
# every `cargo test` and `cargo llvm-cov` run builds it and `cargo install`
# never installs it; run by cargo as a test, it does nothing.
[[test]]
name = "fake_claude"
path = "tests/support/fake_claude.rs"
harness = false

[lints.rust]
future_incompatible = { level = "warn", priority = -1 }
nonstandard_style = { level = "deny", priority = -1 }
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
redundant_clone = "warn"
manual_ok_or = "warn"
needless_collect = "warn"
