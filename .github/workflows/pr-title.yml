name: PR title

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  pull-requests: read

jobs:
  conventional-commit:
    name: Conventional Commit title
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # Pull requests are squash-merged, so GitHub takes the commit subject from
      # the pull request title. Keep it a parsable Conventional Commit.
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Keep in sync with the commit types in CONTRIBUTING.md.
          types: |
            feat
            fix
            docs
            test
            ci
            chore
            refactor
